name: Build Travectory Android APK
# Signed mobile release: 1.1.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile-apk.yml"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_AMAP_JS_KEY: ${{ secrets.NEXT_PUBLIC_AMAP_JS_KEY }}
          NEXT_PUBLIC_AMAP_SECRET: ${{ secrets.NEXT_PUBLIC_AMAP_SECRET }}
          NEXT_PUBLIC_AMAP_WEB_KEY: ${{ secrets.AMAP_WEB_KEY }}
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Restore Android signing key
        if: env.SIGNING_KEY_BASE64 != ''
        run: echo "$SIGNING_KEY_BASE64" | base64 --decode > android/app/travectory-release.jks
      - run: ./gradlew assembleRelease
        if: env.SIGNING_KEY_BASE64 != ''
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: travectory-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Compile unsigned test APK when signing is not configured
        if: env.SIGNING_KEY_BASE64 == ''
        run: ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        if: env.SIGNING_KEY_BASE64 != ''
        with:
          name: travectory-android-v1.1.2
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: env.SIGNING_KEY_BASE64 == ''
        with:
          name: travectory-v1.1.2-signing-not-configured
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
